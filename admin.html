<!doctype html><html lang="en"><head>
<!-- SHARED CONFIG: set the deployed Google Apps Script Web App URL here. -->
<script>const APP_CONFIG={API_URL:'https://script.google.com/macros/s/AKfycbwq35rqPRN2FKSl_9wGtQe1jedU4Nn4f2q1pfcE0jlp8DZY71lPV9dKV3BX2egZnsl-Kw/exec',BRAND_NAME:'Amudi Foods'};</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#137540"><title>Amudi Foods | Admin</title><link rel="icon" href="https://amudifoods.com.np/wp-content/uploads/2025/08/amudi-logo-scaled-300x227.png"><style>
:root{--brand-green:#137540;--brand-lime:#B8C535;--ink:#0B2E1A;--paper:#F6F8EE;--white:#fff;--muted:#68756c;--line:#dce4d8;--error:#a52d2d;font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--paper)}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--brand-lime);outline-offset:2px}.hidden{display:none!important}.top{height:70px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(18px,calc((100vw - 1180px)/2));position:sticky;top:0;z-index:3}.brand{display:flex;align-items:center;gap:12px;font-weight:800}.brand img{width:44px;height:44px;object-fit:contain}.btn{min-height:44px;border:0;border-radius:11px;padding:9px 15px;font-weight:700;background:var(--brand-green);color:white}.btn.secondary{color:var(--ink);background:#edf3eb;border:1px solid var(--line)}.btn.danger{color:#982c2c;background:#fbeeee}.btn:disabled{opacity:.55}.wrap{max-width:1180px;margin:auto;padding:26px 20px 70px}.login{max-width:420px;margin:10vh auto;padding:20px}.panel,.login-box{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 28px #0b2e1a10;padding:22px}.login-logo{max-width:180px;height:64px;object-fit:contain}.field{display:grid;gap:5px;margin:12px 0}.field input,.field textarea{width:100%;border:1px solid #cbd6ca;border-radius:10px;padding:10px 12px;min-height:44px;color:var(--ink);background:white}.field textarea{min-height:76px;resize:vertical}.muted{color:var(--muted)}.error{color:var(--error)}.tabs{display:flex;gap:8px;margin:22px 0}.tab{border:1px solid var(--line);border-radius:99px;background:white;color:var(--ink);padding:9px 16px;min-height:44px;font-weight:700}.tab.active{background:#eaf1dc;border-color:var(--brand-lime)}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.list{display:grid;gap:12px}.entry{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:14px}.entry h3{margin:0 0 4px}.actions{display:flex;gap:8px;flex-wrap:wrap}.tag{font-size:12px;font-weight:700;border-radius:99px;padding:4px 9px;background:var(--brand-lime);color:var(--ink)}.tag.gray{background:#e6e9e6;color:#59605b}.overlay{position:fixed;inset:0;background:#0b2e1a66;z-index:8;display:grid;place-items:center;padding:12px}.dialog{background:white;width:min(720px,100%);max-height:94vh;overflow:auto;padding:22px;border-radius:20px;box-shadow:0 18px 60px #0003}.dialog h2{margin-top:0}.dialog-head{display:flex;justify-content:space-between;align-items:center}.close{width:44px;height:44px;border:0;border-radius:50%;background:#edf3eb;color:var(--ink);font-size:22px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.full{grid-column:1/-1}.checkrow{display:flex;gap:16px;flex-wrap:wrap;margin:12px 0}.checkrow label{display:flex;gap:8px;align-items:center;min-height:42px}.checkrow input{width:20px;height:20px;accent-color:var(--brand-green)}.variant{border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0;background:#fafbf8}.variant-head{display:flex;justify-content:space-between;align-items:center}.empty{padding:36px;text-align:center}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:12px 18px;border-radius:12px;z-index:20}#imagePreview{width:88px;height:70px;object-fit:cover;border-radius:9px}.busy{opacity:.6;pointer-events:none}@media(max-width:640px){.top{padding:0 12px}.wrap{padding:18px 12px}.panel{padding:15px}.entry{align-items:flex-start;flex-direction:column}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.dialog{padding:17px}.toolbar{align-items:flex-start}}
</style></head><body>

<section id="login" class="login"><div class="login-box"><img class="login-logo" src="https://amudifoods.com.np/wp-content/uploads/2025/08/amudi-logo-scaled-300x227.png" alt="Amudi Foods"><h1>Admin sign in</h1><p class="muted">Manage salesman accounts and the product catalog.</p><form id="loginForm"><label class="field">Username<input id="username" autocomplete="username" required></label><label class="field">Password<input id="password" type="password" autocomplete="current-password" required></label><p id="loginError" class="error" role="alert"></p><button class="btn" id="loginBtn">Sign in</button></form></div></section>
<main id="app" class="hidden"><header class="top"><div class="brand"><img src="https://amudifoods.com.np/wp-content/uploads/2025/08/amudi-logo-scaled-300x227.png" alt=""><span>Amudi Foods · Admin</span></div><button class="btn secondary" id="logout">Sign out</button></header><div class="wrap"><h1>Sales operations</h1><p class="muted">Manage salesman accounts and products. Orders are recorded in Google Sheets.</p><nav class="tabs"><button class="tab active" data-tab="salesmen">Salesmen</button><button class="tab" data-tab="products">Products</button></nav><section id="salesmenPanel" class="panel"><div class="toolbar"><div><h2>Salesmen</h2><span class="muted">Create, edit, or deactivate sales accounts.</span></div><button class="btn" onclick="editSalesman()">Add salesman</button></div><div id="salesmen" class="list"></div></section><section id="productsPanel" class="panel hidden"><div class="toolbar"><div><h2>Products</h2><span class="muted">Manage products, sizes, visibility, and stock.</span></div><button class="btn" onclick="editProduct()">Add product</button></div><div id="products" class="list"></div></section></div></main><div id="dialog" class="hidden"></div><div id="toast" class="toast hidden" role="status"></div>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let token=sessionStorage.getItem('amudiAdminToken')||'', salesmen=[],products=[],variants=[], editingProduct=null,imageUrl='';
async function api(action,data={}){if(!APP_CONFIG.API_URL)throw Error('Set the Apps Script Web App URL in the config block.');const res=await fetch(APP_CONFIG.API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,token,...data})});const j=await res.json();if(!j.ok)throw Error(j.error||'Request failed.');return j.data}
$('#loginForm').onsubmit=async e=>{e.preventDefault();$('#loginBtn').disabled=true;$('#loginBtn').textContent='Signing in…';try{const d=await api('adminLogin',{username:$('#username').value,password:$('#password').value});token=d.token;sessionStorage.setItem('amudiAdminToken',token);await start()}catch(x){$('#loginError').textContent=x.message}finally{$('#loginBtn').disabled=false;$('#loginBtn').textContent='Sign in'}};
async function start(){if(!token){$('#login').classList.remove('hidden');$('#app').classList.add('hidden');return}$('#login').classList.add('hidden');$('#app').classList.remove('hidden');try{const d=await api('adminData');salesmen=d.salesmen;products=d.products;render()}catch(e){toast(e.message);if(e.message.toLowerCase().includes('session'))logout()}}
function render(){renderSalesmen();renderProducts()}function renderSalesmen(){$('#salesmen').innerHTML=salesmen.length?salesmen.map(s=>`<article class="entry"><div><h3>${esc(s.name)}</h3><div>Username: <b>${esc(s.username)}</b></div><div class="muted">ID: ${esc(s.id)}</div><div class="muted">${esc(s.email)}</div><div class="muted">Zone: ${esc(s.zone)}</div><p><span class="tag ${s.active?'':'gray'}">${s.active?'Active':'Inactive'}</span></p></div><div class="actions"><button class="btn secondary" onclick="editSalesman('${esc(s.id)}')">Edit</button><button class="btn ${s.active?'danger':'secondary'}" onclick="toggleSalesman('${esc(s.id)}',${!s.active})">${s.active?'Deactivate':'Activate'}</button><button class="btn danger" onclick="deleteSalesman('${esc(s.id)}')">Delete account</button></div></article>`).join(''):'<div class="empty muted">No salesmen yet. Add the first salesman account.</div>'}
function renderProducts(){$('#products').innerHTML=products.length?products.map(p=>`<article class="entry"><div><h3>${esc(p.name)}</h3><div class="actions"><span class="tag ${p.hidden?'gray':''}">${p.hidden?'Hidden':'Visible'}</span><span class="tag ${p.outOfStock?'gray':''}">${p.outOfStock?'Out of stock':'In stock'}</span></div><div class="muted" style="margin-top:8px">${p.variants.map(v=>`${esc(v.sizeLabel)} · ${v.packetsPerBox}/box · MOQ ${v.moq}${v.hidden?' · hidden':''}${v.outOfStock?' · out of stock':''}`).join('<br>')}</div></div><div class="actions"><button class="btn secondary" onclick="editProduct('${esc(p.id)}')">Edit</button><button class="btn danger" onclick="deleteProduct('${esc(p.id)}')">Delete</button></div></article>`).join(''):'<div class="empty muted">No products yet. Add a product and one or more sizes.</div>'}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));$('#salesmenPanel').classList.toggle('hidden',b.dataset.tab!=='salesmen');$('#productsPanel').classList.toggle('hidden',b.dataset.tab!=='products')});
function openDialog(html){$('#dialog').className='overlay';$('#dialog').innerHTML=html}function closeDialog(){$('#dialog').className='hidden';$('#dialog').innerHTML=''}
function editSalesman(id=''){const s=salesmen.find(x=>String(x.id)===String(id))||{};openDialog(`<section class="dialog"><div class="dialog-head"><h2>${id?'Edit':'Add'} salesman</h2><button class="close" onclick="closeDialog()" aria-label="Close">×</button></div><form id="salesmanForm"><input type="hidden" name="id" value="${esc(s.id||'')}"><div class="form-grid"><label class="field">Salesman name<input name="name" required maxlength="120" value="${esc(s.name||'')}"></label><label class="field">Username<input name="username" required maxlength="120" value="${esc(s.username||'')}"></label><label class="field">Salesman email<input type="email" name="email" required value="${esc(s.email||'')}"></label><label class="field">Salesman zone<input name="zone" required maxlength="160" value="${esc(s.zone||'')}"></label><label class="field full">${id?'New password (leave blank to keep current)':'Password'}<input name="password" type="password" ${id?'':'required'} minlength="10" autocomplete="new-password"></label></div><p id="formError" class="error"></p><div class="actions"><button class="btn" id="saveSalesman">Save salesman</button><button type="button" class="btn secondary" onclick="closeDialog()">Cancel</button></div></form></section>`);$('#salesmanForm').onsubmit=async e=>{e.preventDefault();const salesman=Object.fromEntries(new FormData(e.target).entries());$('#saveSalesman').disabled=true;try{await api('saveSalesman',{salesman});await refresh();closeDialog();toast('Salesman saved')}catch(x){$('#formError').textContent=x.message;$('#saveSalesman').disabled=false}}}
async function toggleSalesman(id,active){try{await api('setSalesmanActive',{id,active});await refresh();toast(active?'Salesman activated':'Salesman deactivated')}catch(e){toast(e.message)}}async function deleteSalesman(id){const s=salesmen.find(x=>String(x.id)===String(id));if(!s||!confirm(`Permanently delete salesman ${s.name}? Their saved dealer list will also be deleted; old orders remain.`))return;try{await api('deleteSalesman',{id});await refresh();toast('Salesman account deleted')}catch(e){toast(e.message)}}async function refresh(){const d=await api('adminData');salesmen=d.salesmen;products=d.products;render()}
function variantHtml(v={}){return `<div class="variant"><div class="variant-head"><b>Size variant</b><button type="button" class="btn danger" onclick="this.closest('.variant').remove()">Remove size</button></div><input type="hidden" class="variant-id" value="${esc(v.id||'')}"><div class="form-grid"><label class="field">Size label<input class="sizeLabel" required maxlength="40" placeholder="20g" value="${esc(v.sizeLabel||'')}"></label><label class="field">Packets per box<input class="packets" type="number" required min="1" max="100000" value="${esc(v.packetsPerBox||'')}"></label><label class="field">MOQ (boxes)<input class="moq" type="number" required min="1" max="100000" value="${esc(v.moq||1)}"></label></div><div class="checkrow"><label><input class="vHidden" type="checkbox" ${v.hidden?'checked':''}> Hide size</label><label><input class="vStock" type="checkbox" ${v.outOfStock?'checked':''}> Out of stock</label></div></div>`}
function editProduct(id=''){editingProduct=products.find(x=>String(x.id)===String(id))||null;const p=editingProduct||{name:'',imageUrl:'',imageData:'',hidden:false,outOfStock:false,variants:[{}]};imageUrl=p.imageUrl||'';openDialog(`<section class="dialog"><div class="dialog-head"><h2>${id?'Edit':'Add'} product</h2><button class="close" onclick="closeDialog()" aria-label="Close">×</button></div><form id="productForm"><input type="hidden" id="productId" value="${esc(p.id||'')}"><label class="field">Product name<input id="productName" required maxlength="120" value="${esc(p.name)}"></label><div class="field"><label for="imageFile">Product image (PNG or JPG, auto-optimized; up to 12 MB)</label><input type="file" id="imageFile" accept="image/png,image/jpeg"><div class="actions"><img id="imagePreview" src="${esc(p.imageData||'')}" alt="Image preview" ${p.imageData?'':'class="hidden"'}><span class="muted" id="uploadStatus">${p.imageData?'Current product image':'Choose a product image'}</span></div></div><div class="checkrow"><label><input type="checkbox" id="productHidden" ${p.hidden?'checked':''}> Hide product</label><label><input type="checkbox" id="productStock" ${p.outOfStock?'checked':''}> Out of stock</label></div><div class="toolbar"><h3>Sizes</h3><button type="button" class="btn secondary" onclick="addVariant()">Add size</button></div><div id="variants">${p.variants.map(variantHtml).join('')}</div><p id="productError" class="error"></p><div class="actions"><button class="btn" id="saveProduct">Save product</button><button type="button" class="btn secondary" onclick="closeDialog()">Cancel</button></div></form></section>`);$('#imageFile').onchange=uploadImage;$('#productForm').onsubmit=submitProduct;if(id&&p.imageUrl)api('adminProductImage',{id}).then(d=>{const preview=$('#imagePreview');preview.src=d.dataUrl;preview.classList.remove('hidden');$('#uploadStatus').textContent='Current product image'}).catch(e=>$('#uploadStatus').textContent='Could not load current image: '+e.message)}
function addVariant(){if($('#variants').children.length>=30)return toast('Maximum 30 sizes per product.');$('#variants').insertAdjacentHTML('beforeend',variantHtml({}))}
async function optimizeProductImage(file){const bitmap=await createImageBitmap(file),limit=720,scale=Math.min(1,limit/Math.max(bitmap.width,bitmap.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();return await new Promise((resolve,reject)=>canvas.toBlob(blob=>blob?resolve(blob):reject(new Error('Could not resize this image. Try another PNG or JPG.')),'image/jpeg',0.78))}
async function uploadImage(){const file=$('#imageFile').files[0];if(!file)return;if(!['image/png','image/jpeg'].includes(file.type)||file.size>12*1024*1024){$('#productError').textContent='Choose a PNG or JPG image smaller than 12 MB.';return}$('#productError').textContent='';$('#uploadStatus').textContent='Optimizing image…';$('#saveProduct').disabled=true;try{const optimized=await optimizeProductImage(file);if(optimized.size>2*1024*1024)throw new Error('This image is still too large after optimization. Choose a smaller image.');const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(optimized)});$('#uploadStatus').textContent=`Uploading optimized image (${Math.max(1,Math.round(optimized.size/1024))} KB)…`;const d=await api('uploadImage',{image:{mimeType:'image/jpeg',data}});imageUrl=d.url;const preview=$('#imagePreview');preview.src=d.dataUrl;preview.classList.remove('hidden');await new Promise((resolve,reject)=>{preview.onload=resolve;preview.onerror=()=>reject(new Error('Image upload returned invalid image data. Try another PNG or JPG.'))});$('#uploadStatus').textContent=`Optimized image ready (${Math.max(1,Math.round(optimized.size/1024))} KB)`}catch(e){imageUrl='';$('#productError').textContent=e.message;$('#uploadStatus').textContent='Upload failed'}finally{$('#saveProduct').disabled=false}}
async function submitProduct(e){e.preventDefault();const vs=[...document.querySelectorAll('.variant')].map(el=>({id:el.querySelector('.variant-id').value,sizeLabel:el.querySelector('.sizeLabel').value,packetsPerBox:el.querySelector('.packets').value,moq:el.querySelector('.moq').value,hidden:el.querySelector('.vHidden').checked,outOfStock:el.querySelector('.vStock').checked}));const product={id:$('#productId').value,name:$('#productName').value,imageUrl,hidden:$('#productHidden').checked,outOfStock:$('#productStock').checked,variants:vs};$('#saveProduct').disabled=true;try{await api('saveProduct',{product});await refresh();closeDialog();toast('Product saved')}catch(x){$('#productError').textContent=x.message;$('#saveProduct').disabled=false}}
async function deleteProduct(id){const p=products.find(x=>String(x.id)===String(id));if(!p||!confirm(`Delete ${p.name} and all its sizes?`))return;try{await api('deleteProduct',{id});await refresh();toast('Product deleted')}catch(e){toast(e.message)}}function toast(s){$('#toast').textContent=s;$('#toast').classList.remove('hidden');setTimeout(()=>$('#toast').classList.add('hidden'),2600)}function logout(){sessionStorage.removeItem('amudiAdminToken');token='';start()}$('#logout').onclick=logout;start();
</script></body></html>
