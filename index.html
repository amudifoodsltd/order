<!doctype html><html lang="en"><head>
<!-- SHARED CONFIG: set the deployed Google Apps Script Web App URL here. -->
<script>const APP_CONFIG={API_URL:'https://script.google.com/macros/s/AKfycbwq35rqPRN2FKSl_9wGtQe1jedU4Nn4f2q1pfcE0jlp8DZY71lPV9dKV3BX2egZnsl-Kw/exec',BRAND_NAME:'Amudi Foods'};</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#137540"><title>Amudi Foods | Wholesale ordering</title><link rel="icon" href="https://amudifoods.com.np/wp-content/uploads/2025/08/amudi-logo-scaled-300x227.png"><style>
:root{--brand-green:#137540;--brand-lime:#B8C535;--ink:#0B2E1A;--paper:#F6F8EE;--white:#fff;--muted:#68756c;--line:#dce4d8;--error:#a52d2d;--warn:#8a5a00;--shadow:0 10px 30px #0b2e1a12;--radius:18px;font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--paper)}*{box-sizing:border-box}body{margin:0;min-height:100vh}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid var(--brand-lime);outline-offset:2px}.hidden{display:none!important}.top{height:72px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,calc((100vw - 1120px)/2));position:sticky;top:0;z-index:3}.brand{display:flex;gap:12px;align-items:center;font-weight:750}.brand img{width:46px;height:46px;object-fit:contain}.wrap{max-width:1120px;margin:auto;padding:28px 20px 110px}.welcome h1{font-size:clamp(26px,4vw,36px);margin:4px 0}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:22px}.card{border:1px solid var(--line);background:#fff;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);transition:transform .16s}.card:not(.disabled):active{transform:scale(.985)}.card img{width:100%;height:210px;object-fit:contain;padding:10px;background:#fff}.card-body{padding:14px}.card h2{font-size:16px;margin:0 0 8px}.btn{min-height:46px;border:0;border-radius:12px;background:var(--brand-green);color:#fff;padding:10px 16px;font-weight:700}.btn.secondary{background:#edf3eb;color:var(--ink);border:1px solid var(--line)}.btn.danger{background:#fbeeee;color:var(--error)}.btn:disabled{opacity:.55;cursor:not-allowed}.btn.full{width:100%}.badge{display:inline-flex;padding:4px 9px;border-radius:99px;background:var(--brand-lime);color:var(--ink);font-size:12px;font-weight:700}.badge.gray{background:#e6e9e6;color:#59605b}.disabled{filter:grayscale(1);opacity:.62}.stock{font-size:13px;color:var(--muted);margin:5px 0 10px}.header-actions{display:flex;gap:8px;align-items:center}.cart-button{display:flex;align-items:center;gap:9px}.count{background:var(--brand-lime);color:var(--ink);font-weight:800;border-radius:99px;padding:2px 8px}.login{max-width:440px;margin:9vh auto;padding:18px}.login-box{background:#fff;border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:var(--shadow)}.login-logo{height:68px;max-width:200px;object-fit:contain;display:block;margin-bottom:18px}.field{display:grid;gap:6px;margin:14px 0}.field input,.field textarea{width:100%;border:1px solid #cbd6ca;border-radius:11px;padding:12px;background:white;color:var(--ink);min-height:46px}.error{color:var(--error);font-size:14px}.skel{height:240px;background:linear-gradient(100deg,#e9eee5 25%,#f7f9f4 38%,#e9eee5 55%);background-size:300% 100%;animation:shine 1.1s infinite;border-radius:18px}@keyframes shine{to{background-position:-150% 0}}.veil{position:fixed;inset:0;background:#0b2e1a66;z-index:8;display:flex;align-items:flex-end;justify-content:center}.sheet{background:#fff;border-radius:24px 24px 0 0;width:100%;max-height:90dvh;overflow:auto;padding:20px 20px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -12px 40px #0002}.cart-veil{align-items:stretch;justify-content:flex-end}.cart-veil .cart-sheet{height:100dvh;max-height:none;width:min(440px,92vw);border-radius:22px 0 0 22px}.sheet h2{margin:2px 0 8px}.size-list{display:flex;flex-wrap:wrap;gap:9px;margin:16px 0}.size-chip{min-height:48px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--ink);padding:9px 12px;font-weight:650}.size-chip.selected{background:#eff4de;border-color:var(--brand-lime);box-shadow:inset 0 0 0 1px var(--brand-lime)}.size-chip:disabled{color:#858b86;background:#eee;cursor:not-allowed;text-decoration:line-through}.stepper{display:flex;align-items:center;gap:12px}.qty{font-weight:800;font-size:20px;min-width:30px;text-align:center}.qty-input{width:110px;min-height:48px;text-align:center;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font:700 18px system-ui;padding:8px}.qty-input::-webkit-inner-spin-button,.qty-input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}.qty-input{-moz-appearance:textfield}.drawer{position:fixed;z-index:10;inset:0 0 0 auto;width:min(440px,100%);background:#fff;box-shadow:-10px 0 40px #0002;padding:20px;overflow:auto}.drawer-head{display:flex;justify-content:space-between;align-items:center}.line{padding:15px 0;border-bottom:1px solid var(--line)}.line-top{display:flex;justify-content:space-between;gap:12px}.line small{color:var(--muted)}.mobile-cart{display:none}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:12px 18px;border-radius:12px;z-index:20;box-shadow:var(--shadow)}.success{min-height:65vh;display:grid;place-items:center;text-align:center}.success-icon{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:#e9f2ce;color:var(--brand-green);font-size:40px;margin:0 auto 18px}.empty{text-align:center;padding:44px 10px}.modal-close{border:0;background:#edf3eb;border-radius:50%;width:44px;height:44px;font-size:22px;color:var(--ink)}@media(min-width:720px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.card img{height:230px}.veil{align-items:center}.sheet{width:min(520px,calc(100% - 32px));border-radius:24px}.cart-veil{align-items:stretch}.cart-veil .cart-sheet{width:min(440px,92vw)}.mobile-cart{display:none!important}}@media(min-width:1020px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.wrap{padding-top:36px}}@media(max-width:600px){.top{height:64px;padding:0 14px}.brand img{width:40px;height:40px}.wrap{padding:22px 14px 108px}.cart-veil{align-items:flex-end;justify-content:center}.cart-veil .cart-sheet{height:auto;max-height:90dvh;width:100%;border-radius:24px 24px 0 0}.mobile-cart{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:4;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}.mobile-cart .btn{width:100%;display:flex;justify-content:space-between;align-items:center}.login{margin:6vh auto;padding:14px}.card img{height:190px}}
</style><style>.image-fallback{width:100%;height:210px;display:grid;place-items:center;background:#edf1e9;color:#68736a;font-size:14px}@media(min-width:720px){.image-fallback{height:230px}}@media(max-width:600px){.image-fallback{height:190px}}</style></head><body>

<section id="login" class="login"><div class="login-box"><img src="https://amudifoods.com.np/wp-content/uploads/2025/08/amudi-logo-scaled-300x227.png" class="login-logo" alt="Amudi Foods"><h1>Wholesale ordering</h1><p class="muted">Sign in with the account shared by Amudi Foods.</p><form id="loginForm"><label class="field">Username<input id="username" autocomplete="username" required></label><label class="field">Password<input id="password" type="password" autocomplete="current-password" required></label><div id="loginError" class="error" role="alert"></div><button class="btn full" id="loginSubmit">Sign in</button></form></div></section>
<main id="app" class="hidden"><header class="top"><div class="brand"><img src="https://amudifoods.com.np/wp-content/uploads/2025/08/amudi-logo-scaled-300x227.png" alt=""><span>Amudi Foods</span></div><div class="header-actions"><button class="btn secondary cart-button" id="cartOpen">Cart <span class="count" id="cartCount">0</span></button><button class="btn secondary" id="logout">Sign out</button></div></header><div class="wrap"><div class="welcome"><p class="muted" id="hello"></p><h1>Choose your products</h1><p class="muted">Select a size and order in boxes. Prices are handled offline.</p></div><div id="catalog" class="grid"><div class="skel"></div><div class="skel"></div></div></div><div id="mobileCart" class="mobile-cart hidden"><button class="btn" id="mobileCartOpen"><span>View cart</span><span><b id="mobileCount">0</b> boxes</span></button></div></main>
<div id="layer" class="hidden"></div><div id="toast" class="toast hidden" role="status"></div>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let token=sessionStorage.getItem('amudiToken')||'', customer=JSON.parse(sessionStorage.getItem('amudiCustomer')||'null'), products=[], cart=[], chosenProduct=null, chosenVariant=null, qty=1, busy=false;
async function api(action,data={}){if(!APP_CONFIG.API_URL)throw Error('Set the Apps Script Web App URL in the config block.');const res=await fetch(APP_CONFIG.API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,token,...data})});const j=await res.json();if(!j.ok)throw Error(j.error||'Request failed.');return j.data}
$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();const b=$('#loginSubmit');b.disabled=true;b.textContent='Signing in…';$('#loginError').textContent='';try{const d=await api('login',{username:$('#username').value,password:$('#password').value});token=d.token;customer=d.customer;sessionStorage.setItem('amudiToken',token);sessionStorage.setItem('amudiCustomer',JSON.stringify(customer));await start()}catch(x){$('#loginError').textContent=x.message}finally{b.disabled=false;b.textContent='Sign in'}});
async function start(){if(!token){$('#login').classList.remove('hidden');$('#app').classList.add('hidden');return}$('#login').classList.add('hidden');$('#app').classList.remove('hidden');$('#hello').textContent=customer?.company?`Ordering for ${customer.company}`:'';$('#catalog').innerHTML='<div class="skel"></div><div class="skel"></div>';try{products=await api('catalog');renderCatalog()}catch(e){$('#catalog').innerHTML=`<div class="empty"><p>${esc(e.message)}</p><button class="btn" onclick="logout()">Sign in again</button></div>`}}
function renderCatalog(){if(!products.length){$('#catalog').innerHTML='<div class="empty"><h2>No products available</h2><p class="muted">Check back with Amudi Foods for availability.</p></div>';return}$('#catalog').innerHTML=products.map(p=>{const unavailable=p.outOfStock||!p.variants.length;const src=p.imageData||p.imageUrl;const image=src?`<img src="${esc(src)}" alt="${esc(p.name)}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'image-fallback',textContent:'Product image unavailable'}))">`:'<div class="image-fallback">No product image</div>';return `<article class="card ${unavailable?'disabled':''}">${image}<div class="card-body"><h2>${esc(p.name)}</h2><p class="stock">${p.outOfStock?'Out of stock':p.variants.length?`${p.variants.length} sizes available`:'No sizes available'}</p><button class="btn full" ${unavailable?'disabled':''} onclick="openProduct('${esc(p.id)}')">${unavailable?'Unavailable':'Choose size'}</button></div></article>`}).join('')}
function openProduct(id){chosenProduct=products.find(p=>String(p.id)===String(id));chosenVariant=chosenProduct.variants.find(v=>!v.outOfStock)||chosenProduct.variants[0];qty=chosenVariant?chosenVariant.moq:1;renderSheet()}
function renderSheet(){const p=chosenProduct,v=chosenVariant;$('#layer').className='veil';$('#layer').innerHTML=`<section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="drawer-head"><div><p class="muted">${esc(p.name)}</p><h2 id="sheetTitle">Choose a size</h2></div><button class="modal-close" onclick="closeLayer()" aria-label="Close">×</button></div><div class="size-list">${p.variants.map(x=>`<button class="size-chip ${x.id===v?.id?'selected':''}" ${x.outOfStock||p.outOfStock?'disabled':''} onclick="selectVariant('${esc(x.id)}')">${esc(x.sizeLabel)}</button>`).join('')}</div>${v?`<p class="muted">${v.packetsPerBox} packets per box · minimum ${v.moq} boxes</p><div class="stepper"><label for="qty">Boxes</label><input class="qty-input" id="qty" type="number" inputmode="numeric" min="${v.moq}" max="10000" step="1" value="${qty}" required><span>min ${v.moq}</span></div><button class="btn full" style="margin-top:20px" onclick="addCart()">Add to cart</button>`:'<p class="muted">No sizes are currently available.</p>'}</section>`}
function selectVariant(id){chosenVariant=chosenProduct.variants.find(v=>String(v.id)===String(id));qty=chosenVariant.moq;renderSheet()}function changeQty(value){const input=$('#qty'),n=Number(value);if(!Number.isSafeInteger(n)){input.value=qty;return}qty=Math.max(chosenVariant.moq,Math.min(10000,n));input.value=qty}function closeLayer(){$('#layer').className='hidden';$('#layer').innerHTML=''}
function addCart(){const entered=Number($('#qty').value);if(!Number.isSafeInteger(entered)||entered<chosenVariant.moq||entered>10000){toast('Enter a whole number from '+chosenVariant.moq+' to 10,000 boxes.');return}qty=entered;const old=cart.find(x=>String(x.variantId)===String(chosenVariant.id));if(old&&old.boxes+qty>10000){toast('Maximum 10,000 boxes per size.');return}if(old)old.boxes+=qty;else cart.push({productId:chosenProduct.id,variantId:chosenVariant.id,product:chosenProduct.name,size:chosenVariant.sizeLabel,packetsPerBox:chosenVariant.packetsPerBox,moq:chosenVariant.moq,boxes:qty});closeLayer();renderCartCount();toast('Added to cart')}
function renderCartCount(){const count=cart.reduce((n,x)=>n+x.boxes,0),items=cart.length;$('#cartCount').textContent=items;$('#mobileCount').textContent=count;$('#mobileCart').classList.toggle('hidden',items===0)}
function openCart(){const n=cart.length;$('#layer').className='veil cart-veil';$('#layer').innerHTML=`<section class="sheet cart-sheet" role="dialog" aria-modal="true"><div class="drawer-head"><div><h2>Your cart</h2><p class="muted">${n} ${n===1?'item':'items'}</p></div><button class="modal-close" onclick="closeLayer()" aria-label="Close">×</button></div>${n?cart.map((x,i)=>`<div class="line"><div class="line-top"><div><b>${esc(x.product)} · ${esc(x.size)}</b><br><small>${x.packetsPerBox} packets per box</small></div><button class="btn danger" onclick="removeLine(${i})">Remove</button></div><div class="stepper" style="margin-top:12px"><label for="cartBoxes${i}">Boxes</label><input class="qty-input" id="cartBoxes${i}" type="number" inputmode="numeric" min="${x.moq}" max="10000" step="1" value="${x.boxes}" onchange="editLine(${i},this.value)"><span>min ${x.moq}</span></div></div>`).join(''):'<div class="empty"><p>Your cart is empty.</p></div>'}<button class="btn secondary full" style="margin-top:16px" onclick="closeLayer()">Keep shopping</button><button class="btn full" style="margin-top:10px" ${n?'':'disabled'} id="checkout" onclick="confirmOrder()">Place order</button></section>`}
function editLine(i,value){const boxes=Number(value);if(!Number.isSafeInteger(boxes)||boxes<cart[i].moq||boxes>10000){toast('Enter a whole number from '+cart[i].moq+' to 10,000 boxes.');openCart();return}cart[i].boxes=boxes;openCart();renderCartCount()}function removeLine(i){cart.splice(i,1);renderCartCount();openCart()}
async function confirmOrder(){if(busy)return;if(!cart.length)return;if(!confirm('Place this order? You can contact Amudi Foods if anything needs to change.'))return;busy=true;const b=$('#checkout');if(b){b.disabled=true;b.textContent='Placing order…'}try{const data=await api('placeOrder',{items:cart.map(x=>({productId:x.productId,variantId:x.variantId,boxes:x.boxes}))});cart=[];renderCartCount();$('#layer').className='veil';$('#layer').innerHTML=`<section class="sheet success"><div><div class="success-icon">✓</div><h2>Order placed</h2><p>Thank you. Your order has been sent to Amudi Foods.</p><p class="badge">${esc(data.orderId)}</p><p class="muted">Keep this order ID for your records.</p><button class="btn full" onclick="closeLayer();start()">Continue shopping</button></div></section>`}catch(e){if(e.message.toLowerCase().includes('session'))logout();else{toast(e.message);if(b){b.disabled=false;b.textContent='Place order'}}}finally{busy=false}}
function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');setTimeout(()=>$('#toast').classList.add('hidden'),2400)}function logout(){token='';customer=null;cart=[];sessionStorage.removeItem('amudiToken');sessionStorage.removeItem('amudiCustomer');closeLayer();start()}
$('#cartOpen').onclick=openCart;$('#mobileCartOpen').onclick=openCart;$('#logout').onclick=logout;start();
</script></body></html>
